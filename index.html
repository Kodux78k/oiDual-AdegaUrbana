<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOBLLUX Suite v6 | Ultimate Editor</title>
    <!-- iOS Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- Manifest -->
<link rel="manifest" href="./manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Color Thief (Extração de cor do logo) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    
    <!-- HTML2Canvas (Exportação de imagem) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&family=Montserrat:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'bebas': ['"Bebas Neue"', 'sans-serif'],
                        'mont': ['"Montserrat"', 'sans-serif'],
                        'serif-display': ['"Playfair Display"', 'serif'],
                        'inter': ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#050505',
                            panel: '#0F0F0F',
                            surface: '#18181B',
                            gold: '#D4AF37',
                            accent: '#EAB308'
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(234, 179, 8, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Reset & Scrollbars */
        body { background-color: #050505; color: #e5e5e5; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f0f0f; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Inputs Clean */
        .input-dark {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .input-dark:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: #EAB308;
            outline: none;
        }

        /* Color Picker Custom */
        input[type=color] {
            -webkit-appearance: none; border: none; width: 32px; height: 32px; 
            border-radius: 50%; cursor: pointer; padding: 0; background: transparent;
        }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type=color]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; }

        /* Preview Formats */
        .format-menu { width: 550px; min-height: 850px; transition: transform 0.3s ease; }
        .format-story { width: 450px; height: 800px; transition: transform 0.3s ease; }

        /* Neon & Effects */
        .neon-text { text-shadow: 0 0 10px currentColor; }
        .glass-panel { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Leaders */
        .price-leader { flex-grow: 1; border-bottom: 1px dotted rgba(255,255,255,0.2); margin: 0 12px; position: relative; top: -5px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row bg-brand-dark selection:bg-brand-accent selection:text-black">

    <!-- SIDEBAR EDITOR -->
    <aside class="w-full md:w-[400px] bg-brand-panel border-r border-white/5 flex flex-col h-full z-30 shadow-2xl relative">
        
        <!-- Header -->
        <div class="p-6 border-b border-white/5 bg-gradient-to-br from-[#121212] to-[#0a0a0a]">
            <div class="flex items-center justify-between mb-1">
                <h1 class="text-2xl font-bebas text-white tracking-widest flex items-center gap-2">
                    <i data-lucide="layers" class="text-brand-accent w-6 h-6"></i>
                    KOBLLUX <span class="text-[9px] text-gray-500 font-mont ml-1 bg-white/5 px-1 rounded">v6.0</span>
                </h1>
                <button onclick="app.saveStateJSON()" class="text-gray-500 hover:text-white transition" title="Backup JSON">
                    <i data-lucide="save" class="w-4 h-4"></i>
                </button>
            </div>
            <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500">Marketing Intelligence Suite</p>
        </div>

        <!-- Mode Switcher -->
        <div class="flex border-b border-white/5 bg-[#050505]">
            <button onclick="app.setMode('menu')" id="btn-mode-menu" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest transition hover:bg-white/5 text-brand-accent border-b-2 border-brand-accent">
                <div class="flex flex-col items-center gap-1">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Cardápio
                </div>
            </button>
            <button onclick="app.setMode('promo')" id="btn-mode-promo" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest transition hover:bg-white/5 text-gray-500 border-b-2 border-transparent">
                <div class="flex flex-col items-center gap-1">
                    <i data-lucide="zap" class="w-4 h-4"></i> Story / Flyer
                </div>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div id="editor-scroll" class="flex-1 overflow-y-auto custom-scroll p-5 space-y-6">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- Footer Actions -->
        <div class="p-5 bg-[#080808] border-t border-white/5 space-y-3 z-20">
            <!-- Menu Actions -->
            <div id="menu-only-actions" class="grid grid-cols-2 gap-3">
                <button onclick="app.addSection('list')" class="py-3 bg-white/5 rounded-lg text-[10px] font-bold uppercase hover:bg-white/10 transition border border-white/5 flex items-center justify-center gap-2">
                    <i data-lucide="list-plus" class="w-3 h-3"></i> Lista
                </button>
                <button onclick="app.addSection('grid')" class="py-3 bg-white/5 rounded-lg text-[10px] font-bold uppercase hover:bg-white/10 transition border border-white/5 flex items-center justify-center gap-2">
                    <i data-lucide="grid" class="w-3 h-3"></i> Tabela
                </button>
            </div>

            <!-- Promo Actions -->
            <div id="promo-only-actions" class="hidden">
                <button onclick="app.modal.open()" class="w-full py-3 bg-white/10 rounded-lg text-[10px] font-bold uppercase hover:bg-white/15 transition border border-white/10 text-brand-accent flex items-center justify-center gap-2">
                    <i data-lucide="wand-2" class="w-4 h-4"></i> Assistente de Promoção
                </button>
            </div>

            <button onclick="app.exportImage()" id="btn-export" class="w-full bg-brand-accent hover:bg-yellow-400 text-black font-black py-4 rounded-xl shadow-glow transition-all transform active:scale-95 flex items-center justify-center gap-3 uppercase tracking-widest text-xs group">
                <i data-lucide="download" class="w-4 h-4 group-hover:animate-bounce"></i> Exportar Imagem HD
            </button>
        </div>
    </aside>

    <!-- PREVIEW AREA -->
    <main class="flex-1 bg-[#020202] relative overflow-hidden flex flex-col">
        <!-- Background Pattern -->
        <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#333 1px, transparent 1px); background-size: 24px 24px;"></div>
        
        <!-- Canvas Wrapper -->
        <div class="flex-1 overflow-auto flex justify-center items-start p-10 custom-scroll z-10" id="canvas-wrapper">
            
            <!-- MENU PREVIEW -->
            <div id="preview-menu" class="format-menu bg-black text-white relative flex flex-col shadow-2xl overflow-hidden animate-in">
                <!-- Top Accent -->
                <div id="menu-accent-bar" class="w-full h-1.5 bg-brand-accent absolute top-0 left-0 z-20"></div>
                
                <div class="p-12 flex flex-col h-full relative z-10">
                    <!-- Header -->
                    <div class="text-center mb-10">
                        <div class="relative w-32 h-32 mx-auto mb-6 group cursor-pointer" onclick="document.getElementById('logo-upload').click()">
                            <div id="logo-glow" class="absolute inset-0 rounded-full blur-2xl opacity-30 bg-brand-accent transition duration-500"></div>
                            <img id="preview-logo" src="https://via.placeholder.com/300x300/111/444?text=LOGO" class="w-full h-full object-cover rounded-full border-2 border-white/10 relative z-10 bg-black">
                            <div class="absolute inset-0 z-20 flex items-center justify-center bg-black/60 rounded-full opacity-0 group-hover:opacity-100 transition backdrop-blur-sm">
                                <i data-lucide="camera" class="text-white w-6 h-6"></i>
                            </div>
                        </div>
                        <h1 id="preview-title" class="text-6xl font-bebas tracking-[0.1em] leading-none mb-2">ADEGA CLUB</h1>
                        <p class="text-[10px] tracking-[0.6em] text-gray-500 uppercase font-bold">Premium Drinks & Lounge</p>
                    </div>

                    <!-- Content (Dynamic) -->
                    <div id="menu-content" class="space-y-8 flex-1"></div>

                    <!-- Footer -->
                    <div class="mt-auto pt-10 text-center opacity-30">
                        <div class="flex items-center justify-center gap-4 mb-2">
                            <div class="h-px bg-white w-12"></div>
                            <i data-lucide="wine" class="w-3 h-3 text-white"></i>
                            <div class="h-px bg-white w-12"></div>
                        </div>
                        <p class="text-[8px] tracking-widest uppercase">Se beber não dirija • Proibido para menores</p>
                    </div>
                </div>
            </div>

            <!-- PROMO PREVIEW (STORY) -->
            <div id="preview-promo" class="format-story hidden shadow-2xl overflow-hidden animate-in relative group">
                <!-- Injected via Template Engine -->
            </div>

        </div>

        <!-- Zoom Controls -->
        <div class="absolute bottom-6 right-6 flex gap-2 z-20">
            <button onclick="app.zoom(-0.1)" class="w-8 h-8 rounded bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition"><i data-lucide="minus" class="w-4 h-4"></i></button>
            <button onclick="app.zoom(0.1)" class="w-8 h-8 rounded bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
    </main>

    <!-- MODAL: PROMO WIZARD -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-[#111] border border-white/10 w-[90%] md:w-[700px] max-h-[85vh] rounded-2xl shadow-2xl flex flex-col transform scale-95 transition-transform duration-300" id="modal-panel">
            
            <!-- Modal Header -->
            <div class="p-5 border-b border-white/5 flex justify-between items-center bg-[#151515] rounded-t-2xl">
                <div>
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="wand-2" class="w-4 h-4 text-brand-accent"></i> Seleção Inteligente
                    </h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider">Escolha os itens para o Flyer</p>
                </div>
                <button onclick="app.modal.close()" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <!-- Modal Content -->
            <div class="p-5 overflow-y-auto custom-scroll flex-1">
                
                <div class="flex gap-2 mb-4">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                        <input id="modal-search" type="text" placeholder="Buscar produto..." class="w-full bg-black/30 border border-white/10 rounded-lg py-2 pl-9 pr-4 text-sm text-gray-300 focus:border-brand-accent outline-none">
                    </div>
                    <button onclick="app.modal.autoGen()" class="px-4 py-2 bg-brand-accent/10 text-brand-accent border border-brand-accent/20 rounded-lg text-xs font-bold uppercase hover:bg-brand-accent hover:text-black transition flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> Auto-Sugerir
                    </button>
                </div>

                <div id="modal-list" class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <!-- Items injected here -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-5 border-t border-white/5 bg-[#151515] rounded-b-2xl flex justify-between items-center">
                <div class="text-xs text-gray-400">
                    <span id="modal-count" class="text-white font-bold">0</span> itens selecionados
                </div>
                <div class="flex gap-2">
                    <button onclick="app.aiPrompt()" class="px-4 py-2 bg-white/5 text-gray-300 rounded-lg text-xs font-bold hover:bg-white/10 transition flex items-center gap-2 border border-white/5">
                        <i data-lucide="copy" class="w-3 h-3"></i> Prompt IA Vídeo
                    </button>
                    <button onclick="app.modal.apply()" class="px-6 py-2 bg-brand-accent text-black rounded-lg text-xs font-bold uppercase hover:bg-yellow-400 transition shadow-glow flex items-center gap-2">
                        Gerar Flyer <i data-lucide="arrow-right" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <!-- HIDDEN INPUTS -->
    <input type="file" id="logo-upload" class="hidden" accept="image/*" onchange="app.handleLogo(this)">
    <input type="file" id="json-upload" class="hidden" accept="application/json" onchange="app.loadStateJSON(this)">

    <!-- LOGIC -->
    <script>
        const app = {
            state: {
                mode: 'menu', // 'menu' | 'promo'
                zoom: 1,
                colors: { primary: '#EAB308', bg: '#000000', text: '#FFFFFF' },
                menu: {
                    title: 'ADEGA CLUB',
                    sections: [
                        { id: 1, type: 'grid', title: 'WHISKY IMPORTADO', items: [{name: 'Red Label', p1: '15,00', p2: '140,00'}, {name: 'Black Label', p1: '25,00', p2: '220,00'}, {name: 'Jack Daniels', p1: '22,00', p2: '190,00'}] },
                        { id: 2, type: 'list', title: 'COMBOS & KITS', items: [{name: 'Combo Gin Tanqueray + 4 Tônicas', p: '280,00'}, {name: 'Combo Ciroc + 2 Sucos', p: '320,00'}] }
                    ]
                },
                promo: {
                    template: 'night', // 'night', 'clean', 'flash'
                    headline: 'OFERTA RELÂMPAGO',
                    sub: 'VÁLIDO SOMENTE HOJE',
                    item: { name: 'Combo Red Label', price: '140,00', oldPrice: '180,00' },
                    qr: 'https://wa.me/55000000000',
                    items: [] // For multi-item promos logic
                }
            },

            // --- INIT ---
            init() {
                this.renderEditor();
                this.renderPreview();
                lucide.createIcons();
                
                // Color Picker Listener
                const updateColors = () => { this.renderPreview(); };
            },

            // --- UI ACTIONS ---
            setMode(m) {
                this.state.mode = m;
                // Update Sidebar Tabs
                document.getElementById('btn-mode-menu').className = `flex-1 py-4 text-[10px] font-bold uppercase tracking-widest transition hover:bg-white/5 ${m==='menu' ? 'text-brand-accent border-b-2 border-brand-accent' : 'text-gray-500 border-b-2 border-transparent'}`;
                document.getElementById('btn-mode-promo').className = `flex-1 py-4 text-[10px] font-bold uppercase tracking-widest transition hover:bg-white/5 ${m==='promo' ? 'text-brand-accent border-b-2 border-brand-accent' : 'text-gray-500 border-b-2 border-transparent'}`;
                
                // Visibility
                document.getElementById('preview-menu').style.display = m === 'menu' ? 'flex' : 'none';
                document.getElementById('preview-promo').style.display = m === 'promo' ? 'flex' : 'none';
                document.getElementById('menu-only-actions').style.display = m === 'menu' ? 'grid' : 'none';
                document.getElementById('promo-only-actions').style.display = m === 'promo' ? 'block' : 'none';

                this.renderEditor();
                this.renderPreview();
                lucide.createIcons();
            },

            zoom(delta) {
                this.state.zoom = Math.max(0.5, Math.min(2, this.state.zoom + delta));
                const wrapper = document.querySelector('.format-menu:visible') || document.querySelector('.format-story:visible');
                // Note: The structure requires applying zoom to the container or transforming elements
                // Simple implementation:
                const m = document.getElementById('preview-menu');
                const p = document.getElementById('preview-promo');
                m.style.transform = `scale(${this.state.zoom})`;
                p.style.transform = `scale(${this.state.zoom})`;
                m.style.marginTop = this.state.zoom < 1 ? '0px' : `${(this.state.zoom-1)*100}px`; 
                // A proper zoom implementation would use a wrapper div with transform-origin top center.
                // Keeping it simple for the single file request.
            },

            showToast(msg, type = 'success') {
                const container = document.getElementById('toast-container');
                const el = document.createElement('div');
                const color = type === 'success' ? 'bg-green-500' : 'bg-blue-500';
                el.className = `${color} text-black px-6 py-3 rounded-full font-bold text-xs shadow-lg transform translate-y-10 opacity-0 transition-all duration-300 flex items-center gap-2`;
                el.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'info'}" class="w-4 h-4"></i> ${msg}`;
                container.appendChild(el);
                lucide.createIcons();
                
                // Animate In
                requestAnimationFrame(() => {
                    el.classList.remove('translate-y-10', 'opacity-0');
                });

                // Remove
                setTimeout(() => {
                    el.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            },

            // --- CORE LOGIC: EDITOR RENDER ---
            renderEditor() {
                const container = document.getElementById('editor-scroll');
                container.innerHTML = '';
                const c = this.state.colors;

                // 1. Aesthetics Panel
                const aestheticsHtml = `
                    <div class="glass-panel p-4 rounded-xl mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Identidade Visual</span>
                            <i data-lucide="palette" class="w-3 h-3 text-gray-600"></i>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex flex-col items-center gap-1 group">
                                <input type="color" value="${c.primary}" onchange="app.updateColor('primary', this.value)" class="transition transform group-hover:scale-110">
                                <span class="text-[9px] text-gray-500">COR</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 group">
                                <input type="color" value="${c.bg}" onchange="app.updateColor('bg', this.value)" class="transition transform group-hover:scale-110">
                                <span class="text-[9px] text-gray-500">FUNDO</span>
                            </div>
                            <div class="flex-1">
                                <label class="text-[9px] text-gray-500 block mb-1">TÍTULO PRINCIPAL</label>
                                <input type="text" value="${this.state.menu.title}" oninput="app.updateTitle(this.value)" class="input-dark w-full px-3 py-2 rounded text-white font-bebas tracking-wide text-lg">
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += aestheticsHtml;

                if (this.state.mode === 'menu') {
                    // MENU EDITOR
                    this.state.menu.sections.forEach((sec, sIdx) => {
                        let itemsHtml = sec.items.map((it, iIdx) => `
                            <div class="flex gap-2 mb-2 items-center group/item animate-in" style="animation-delay: ${iIdx*50}ms">
                                <div class="cursor-move text-gray-700 hover:text-gray-500"><i data-lucide="grip-vertical" class="w-3 h-3"></i></div>
                                <input type="text" value="${it.name}" oninput="app.editItem(${sec.id}, ${iIdx}, 'name', this.value)" class="input-dark flex-1 px-2 py-1.5 rounded text-xs text-gray-300">
                                ${ sec.type === 'grid' 
                                    ? `<input type="text" value="${it.p1}" oninput="app.editItem(${sec.id}, ${iIdx}, 'p1', this.value)" class="input-dark w-12 px-1 py-1.5 rounded text-xs text-center font-mono">
                                       <input type="text" value="${it.p2}" oninput="app.editItem(${sec.id}, ${iIdx}, 'p2', this.value)" class="input-dark w-12 px-1 py-1.5 rounded text-xs text-center font-mono">`
                                    : `<input type="text" value="${it.p}" oninput="app.editItem(${sec.id}, ${iIdx}, 'p', this.value)" class="input-dark w-16 px-1 py-1.5 rounded text-xs text-center font-mono">`
                                }
                                <button onclick="app.deleteItem(${sec.id}, ${iIdx})" class="text-red-900 hover:text-red-500 transition opacity-0 group-hover/item:opacity-100"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                            </div>
                        `).join('');

                        container.innerHTML += `
                            <div class="glass-panel p-4 rounded-xl mb-4 group/sec transition hover:border-white/10 relative">
                                <div class="absolute right-4 top-4 opacity-0 group-hover/sec:opacity-100 transition">
                                    <button onclick="app.deleteSection(${sec.id})" class="text-red-500 hover:bg-red-500/10 p-1 rounded"><i data-lucide="trash" class="w-3 h-3"></i></button>
                                </div>
                                <input type="text" value="${sec.title}" oninput="app.editSecTitle(${sec.id}, this.value)" class="bg-transparent text-brand-accent font-bold uppercase text-sm tracking-widest mb-4 outline-none w-[80%]">
                                <div class="space-y-1">${itemsHtml}</div>
                                <button onclick="app.addItem(${sec.id})" class="mt-3 w-full py-2 border border-dashed border-white/10 rounded text-[10px] text-gray-500 hover:text-white hover:border-white/20 transition flex items-center justify-center gap-1">
                                    <i data-lucide="plus" class="w-3 h-3"></i> Adicionar Item
                                </button>
                            </div>
                        `;
                    });
                } else {
                    // PROMO EDITOR
                    const p = this.state.promo;
                    container.innerHTML += `
                        <div class="glass-panel p-1 rounded-lg flex mb-6">
                            ${['night', 'clean', 'flash'].map(t => `
                                <button onclick="app.setPromoTemplate('${t}')" class="flex-1 py-2 text-[10px] font-bold uppercase rounded transition ${p.template === t ? 'bg-brand-accent text-black shadow-lg' : 'text-gray-500 hover:text-white'}">
                                    ${t}
                                </button>
                            `).join('')}
                        </div>

                        <div class="glass-panel p-4 rounded-xl space-y-4">
                            <div>
                                <label class="text-[9px] text-gray-500 font-bold uppercase block mb-1">Headline (Chamada)</label>
                                <input type="text" value="${p.headline}" oninput="app.updatePromo('headline', this.value)" class="input-dark w-full px-3 py-2 rounded text-sm text-white">
                            </div>
                             <div>
                                <label class="text-[9px] text-gray-500 font-bold uppercase block mb-1">Sub-título</label>
                                <input type="text" value="${p.sub}" oninput="app.updatePromo('sub', this.value)" class="input-dark w-full px-3 py-2 rounded text-sm text-white">
                            </div>
                            <div class="pt-2 border-t border-white/5">
                                <p class="text-[9px] text-brand-accent mb-2 uppercase tracking-wider">Item Principal</p>
                                <input type="text" value="${p.item.name}" oninput="app.updatePromoItem('name', this.value)" class="input-dark w-full px-3 py-2 rounded text-sm text-white mb-2 font-bold">
                                <div class="flex gap-2">
                                    <div class="flex-1">
                                        <label class="text-[8px] text-gray-500">PREÇO DE</label>
                                        <input type="text" value="${p.item.oldPrice}" oninput="app.updatePromoItem('oldPrice', this.value)" class="input-dark w-full px-2 py-1 rounded text-xs">
                                    </div>
                                    <div class="flex-1">
                                        <label class="text-[8px] text-gray-500">PREÇO POR</label>
                                        <input type="text" value="${p.item.price}" oninput="app.updatePromoItem('price', this.value)" class="input-dark w-full px-2 py-1 rounded text-xs text-brand-accent font-bold">
                                    </div>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-white/5">
                                <label class="text-[9px] text-gray-500 font-bold uppercase block mb-1">Link QR Code</label>
                                <input type="text" value="${p.qr}" oninput="app.updatePromo('qr', this.value)" class="input-dark w-full px-3 py-2 rounded text-xs text-gray-400 font-mono">
                            </div>
                        </div>
                    `;
                }
            },

            // --- CORE LOGIC: PREVIEW RENDER ---
            renderPreview() {
                const c = this.state.colors;
                const menu = document.getElementById('preview-menu');
                const promo = document.getElementById('preview-promo');

                // Apply Colors
                menu.style.backgroundColor = c.bg;
                menu.style.color = c.text;
                document.getElementById('menu-accent-bar').style.backgroundColor = c.primary;
                document.getElementById('preview-title').innerText = this.state.menu.title;
                document.getElementById('logo-glow').style.backgroundColor = c.primary;

                // Render Menu Content
                const menuContent = document.getElementById('menu-content');
                menuContent.innerHTML = '';
                this.state.menu.sections.forEach(sec => {
                    let itemsHtml = '';
                    if (sec.type === 'grid') {
                        itemsHtml = sec.items.map(it => `
                            <div class="flex items-end justify-between py-1 border-b border-white/5 group">
                                <span class="text-sm font-semibold uppercase tracking-tight opacity-90">${it.name}</span>
                                <div class="flex gap-6">
                                    <span class="w-12 text-right font-bebas text-xl leading-none" style="color:${c.primary}">${it.p1}</span>
                                    <span class="w-12 text-right font-bebas text-xl leading-none" style="color:${c.primary}">${it.p2}</span>
                                </div>
                            </div>
                        `).join('');
                        menuContent.innerHTML += `
                            <div>
                                <div class="flex justify-between items-center mb-4 border-l-4 pl-3" style="border-color:${c.primary}">
                                    <h2 class="text-2xl font-bebas tracking-widest leading-none">${sec.title}</h2>
                                    <div class="flex gap-6 text-[9px] font-bold text-gray-500 uppercase tracking-widest mr-1">
                                        <span class="w-12 text-right">Dose</span>
                                        <span class="w-12 text-right">Garrafa</span>
                                    </div>
                                </div>
                                <div class="space-y-1">${itemsHtml}</div>
                            </div>`;
                    } else {
                        itemsHtml = sec.items.map(it => `
                            <div class="flex items-baseline justify-between mb-2 group">
                                <span class="text-base font-medium uppercase opacity-90">${it.name}</span>
                                <div class="price-leader"></div>
                                <span class="font-bebas text-2xl leading-none" style="color:${c.primary}">${it.p}</span>
                            </div>
                        `).join('');
                        menuContent.innerHTML += `
                            <div>
                                <h2 class="text-2xl font-bebas tracking-widest leading-none mb-4 text-center pb-2 border-b border-white/10" style="color:${c.primary}">${sec.title}</h2>
                                <div>${itemsHtml}</div>
                            </div>`;
                    }
                });

                // Render Promo
                this.renderPromoTemplate();
            },

            renderPromoTemplate() {
                const container = document.getElementById('preview-promo');
                const p = this.state.promo;
                const c = this.state.colors;
                const logoSrc = document.getElementById('preview-logo').src;
                let html = '';

                if (p.template === 'night') {
                    html = `
                        <div class="w-full h-full bg-[#050505] relative flex flex-col p-10 text-white">
                            <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[12rem] font-black text-white/5 pointer-events-none select-none font-bebas transform -rotate-12">PROMO</div>
                            
                            <div class="relative z-10 flex justify-between items-center mb-10">
                                <img src="${logoSrc}" class="w-14 h-14 rounded-full border border-white/20 shadow-lg">
                                <div class="text-right">
                                    <div class="text-xl font-bebas tracking-widest">${this.state.menu.title}</div>
                                    <div class="text-[8px] uppercase tracking-[0.3em] text-gray-500">Exclusive Offer</div>
                                </div>
                            </div>

                            <div class="relative z-10 text-center flex-1 flex flex-col justify-center">
                                <h3 class="text-2xl font-black italic text-brand-accent mb-2" style="color:${c.primary}">${p.headline}</h3>
                                <h2 class="text-5xl font-bebas leading-[0.9] mb-8 text-white">${p.item.name}</h2>
                                <div class="inline-block bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-glow" style="--tw-shadow-color: ${c.primary}33">
                                    <span class="block text-lg text-gray-500 line-through mb-1">R$ ${p.item.oldPrice}</span>
                                    <span class="block text-8xl font-bebas leading-none neon-text" style="color:${c.primary}">${p.item.price}</span>
                                </div>
                                <p class="mt-6 text-xs uppercase tracking-widest text-gray-400 font-bold">${p.sub}</p>
                            </div>

                            <div class="relative z-10 mt-auto flex items-center justify-between bg-[#111] p-4 rounded-xl border border-white/10">
                                <div>
                                    <div class="text-white font-bold text-xs uppercase">Peça Agora</div>
                                    <div class="text-[8px] text-gray-500">Delivery via WhatsApp/App</div>
                                </div>
                                <div id="promo-qr-target" class="bg-white p-1 rounded"></div>
                            </div>
                        </div>
                    `;
                } else if (p.template === 'clean') {
                    html = `
                        <div class="w-full h-full bg-[#F5F5F5] text-[#111] p-8 flex flex-col">
                            <div class="border-2 border-[#111] h-full p-6 flex flex-col relative">
                                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#F5F5F5] px-4">
                                    <img src="${logoSrc}" class="w-12 h-12 rounded-full border border-[#111] grayscale">
                                </div>
                                
                                <div class="mt-10 text-center flex-1">
                                    <p class="font-serif-display italic text-2xl mb-6 opacity-80">${this.state.menu.title}</p>
                                    <h2 class="text-5xl font-inter font-black uppercase tracking-tighter mb-2">${p.item.name}</h2>
                                    <div class="w-12 h-1 bg-[#111] mx-auto my-6"></div>
                                    <p class="text-sm font-bold uppercase tracking-widest mb-8 text-gray-500">${p.headline}</p>
                                    <div class="flex items-center justify-center gap-4">
                                        <span class="text-2xl line-through text-gray-400">R$ ${p.item.oldPrice}</span>
                                        <span class="text-7xl font-inter font-black">R$ ${p.item.price}</span>
                                    </div>
                                </div>

                                <div class="text-center mt-auto">
                                    <div id="promo-qr-target" class="mx-auto w-[60px] h-[60px] mb-2"></div>
                                    <p class="text-[9px] font-bold uppercase tracking-[0.2em]">Escaneie para comprar</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // FLASH
                    html = `
                        <div class="w-full h-full bg-brand-accent text-black p-4 flex flex-col" style="background-color:${c.primary}">
                            <div class="bg-black text-white p-4 rounded-xl text-center shadow-2xl transform -rotate-1 mt-4">
                                <h2 class="text-4xl font-black uppercase italic tracking-tighter">${p.headline}</h2>
                            </div>
                            
                            <div class="flex-1 flex flex-col items-center justify-center relative">
                                <div class="absolute inset-0 flex items-center justify-center opacity-10">
                                    <i data-lucide="zap" class="w-64 h-64 text-black"></i>
                                </div>
                                <h1 class="text-5xl font-bebas text-center leading-none mb-4 z-10 px-4">${p.item.name}</h1>
                                <div class="bg-white p-8 rounded-full shadow-[0_0_40px_rgba(0,0,0,0.3)] w-64 h-64 flex flex-col items-center justify-center z-10 border-8 border-black">
                                    <span class="text-lg font-bold line-through opacity-40">R$ ${p.item.oldPrice}</span>
                                    <span class="text-2xl font-black">POR APENAS</span>
                                    <span class="text-6xl font-black tracking-tighter">R$ ${p.item.price}</span>
                                </div>
                            </div>

                            <div class="bg-black text-white p-6 rounded-t-3xl text-center">
                                <p class="text-sm font-bold uppercase mb-3">${p.sub}</p>
                                <div class="bg-white p-2 inline-block rounded-lg" id="promo-qr-target"></div>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
                setTimeout(() => this.generateQR(), 50);
                lucide.createIcons();
            },

            generateQR() {
                const target = document.getElementById('promo-qr-target');
                if (target) {
                    target.innerHTML = '';
                    new QRCode(target, {
                        text: this.state.promo.qr,
                        width: 50,
                        height: 50,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.L
                    });
                }
            },

            // --- DATA MANIPULATION ---
            updateColor(k, v) { this.state.colors[k] = v; this.renderPreview(); },
            updateTitle(v) { this.state.menu.title = v; this.renderPreview(); },
            updatePromo(k, v) { this.state.promo[k] = v; this.renderPreview(); },
            updatePromoItem(k, v) { this.state.promo.item[k] = v; this.renderPreview(); },
            setPromoTemplate(t) { this.state.promo.template = t; this.renderEditor(); this.renderPreview(); },
            
            editItem(sid, iid, f, v) { this.state.menu.sections.find(s=>s.id===sid).items[iid][f] = v; this.renderPreview(); },
            editSecTitle(sid, v) { this.state.menu.sections.find(s=>s.id===sid).title = v; this.renderPreview(); },
            addItem(sid) { 
                const s = this.state.menu.sections.find(s=>s.id===sid);
                s.items.push(s.type==='grid' ? {name:'Novo', p1:'0', p2:'0'} : {name:'Novo', p:'0'});
                this.renderEditor(); this.renderPreview();
                lucide.createIcons();
            },
            deleteItem(sid, iid) {
                this.state.menu.sections.find(s=>s.id===sid).items.splice(iid, 1);
                this.renderEditor(); this.renderPreview();
                lucide.createIcons();
            },
            addSection(type) {
                this.state.menu.sections.push({id: Date.now(), type, title:'NOVA SEÇÃO', items:[]});
                this.renderEditor(); this.renderPreview();
                lucide.createIcons();
            },
            deleteSection(sid) {
                if(confirm('Tem certeza?')) {
                    this.state.menu.sections = this.state.menu.sections.filter(s=>s.id!==sid);
                    this.renderEditor(); this.renderPreview();
                    lucide.createIcons();
                }
            },

            handleLogo(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.getElementById('preview-logo');
                        img.src = e.target.result;
                        img.onload = () => {
                            const color = new ColorThief().getColor(img);
                            const hex = "#" + ((1 << 24) + (color[0] << 16) + (color[1] << 8) + color[2]).toString(16).slice(1);
                            this.updateColor('primary', hex);
                            this.renderEditor(); // Refresh color picker
                            this.showToast('Paleta de cores atualizada pelo logo!');
                        }
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },

            // --- NEW FEATURES (PATCH INTEGRATION) ---
            
            modal: {
                selectedItems: new Set(),
                
                open() {
                    const overlay = document.getElementById('modal-overlay');
                    const panel = document.getElementById('modal-panel');
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                    
                    // Animations
                    requestAnimationFrame(() => {
                        overlay.classList.remove('opacity-0');
                        panel.classList.remove('scale-95');
                        panel.classList.add('scale-100');
                    });

                    this.renderList();
                },

                close() {
                    const overlay = document.getElementById('modal-overlay');
                    const panel = document.getElementById('modal-panel');
                    overlay.classList.add('opacity-0');
                    panel.classList.remove('scale-100');
                    panel.classList.add('scale-95');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        overlay.classList.remove('flex');
                    }, 300);
                },

                renderList(filter = '') {
                    const listEl = document.getElementById('modal-list');
                    listEl.innerHTML = '';
                    let allItems = [];
                    
                    app.state.menu.sections.forEach(s => {
                        s.items.forEach(i => {
                            allItems.push({...i, section: s.title, price: i.p || i.p1 || '0'});
                        });
                    });

                    if(filter) {
                        allItems = allItems.filter(i => i.name.toLowerCase().includes(filter.toLowerCase()));
                    }

                    allItems.forEach((item, idx) => {
                        const isSelected = this.selectedItems.has(item.name);
                        const el = document.createElement('div');
                        el.className = `p-3 rounded-lg border ${isSelected ? 'border-brand-accent bg-brand-accent/10' : 'border-white/5 bg-white/5'} cursor-pointer hover:bg-white/10 transition flex items-center justify-between group`;
                        el.onclick = () => this.toggleItem(item.name, item.price);
                        el.innerHTML = `
                            <div>
                                <div class="font-bold text-sm text-gray-200">${item.name}</div>
                                <div class="text-[10px] text-gray-500 uppercase">${item.section}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-brand-accent font-mono text-xs">${item.price}</div>
                                <div class="w-4 h-4 rounded border border-white/20 ml-auto mt-1 flex items-center justify-center ${isSelected?'bg-brand-accent border-brand-accent':''}">
                                    ${isSelected ? '<i data-lucide="check" class="w-3 h-3 text-black"></i>' : ''}
                                </div>
                            </div>
                        `;
                        listEl.appendChild(el);
                    });
                    lucide.createIcons();
                },

                toggleItem(name, price) {
                    if (this.selectedItems.has(name)) {
                        this.selectedItems.delete(name);
                    } else {
                        // For this version, we select one main item, but logic allows multiselect
                        this.selectedItems.clear(); // Single select behavior for simplicity in v6
                        this.selectedItems.add(name);
                        app.state.promo.item.name = name;
                        app.state.promo.item.price = price;
                    }
                    this.renderList();
                    document.getElementById('modal-count').innerText = this.selectedItems.size;
                },

                autoGen() {
                    const keywords = ['combo', 'kit', 'balde', 'promo', 'pack'];
                    let found = false;
                    
                    // Logic: Find first item matching keywords
                    app.state.menu.sections.forEach(s => {
                        if(found) return;
                        s.items.forEach(i => {
                            if(found) return;
                            if (keywords.some(k => i.name.toLowerCase().includes(k))) {
                                this.toggleItem(i.name, i.p || i.p1);
                                found = true;
                                app.showToast('Item promocional encontrado!', 'success');
                            }
                        });
                    });

                    if(!found) app.showToast('Nenhum combo óbvio encontrado. Selecione manualmente.', 'info');
                },

                apply() {
                    if(this.selectedItems.size === 0) return app.showToast('Selecione ao menos 1 item', 'info');
                    app.renderEditor();
                    app.renderPreview();
                    app.showToast('Flyer atualizado com sucesso!');
                    this.close();
                }
            },

            // Search Listener
            setupListeners() {
                document.getElementById('modal-search').addEventListener('input', (e) => {
                    this.modal.renderList(e.target.value);
                });
            },

            aiPrompt() {
                const p = this.state.promo;
                const prompt = `Motion Design Brief for Alcohol Brand.
Title: "${p.headline}".
Product: "${p.item.name}" (Price: ${p.item.price}).
Brand Colors: Gold (${this.state.colors.primary}) & Black.
Vibe: Premium, Cinematic, Slow Motion, Particles, Neon Glows.
Animation: Logo reveal, text slide-in, product pop-up, price impact.`;
                navigator.clipboard.writeText(prompt);
                this.showToast('Prompt copiado! Cole no seu gerador de vídeo IA.');
            },

            // --- EXPORT & SAVE ---
            exportImage() {
                const target = this.state.mode === 'menu' ? document.getElementById('preview-menu') : document.getElementById('preview-promo');
                const btn = document.getElementById('btn-export');
                const oldContent = btn.innerHTML;
                
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Renderizando...`;
                lucide.createIcons();

                html2canvas(target, {
                    scale: 3, // High Res
                    useCORS: true,
                    backgroundColor: null,
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `KOBLLUX-${this.state.mode}-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                    
                    btn.innerHTML = oldContent;
                    lucide.createIcons();
                    this.showToast('Imagem exportada em Ultra HD!');
                });
            },

            saveStateJSON() {
                const data = JSON.stringify(this.state);
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'kobllux-data.json';
                a.click();
                this.showToast('Backup salvo com sucesso!');
            },

            loadStateJSON(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        this.state = JSON.parse(e.target.result);
                        this.init();
                        this.showToast('Dados carregados com sucesso!');
                    } catch (err) {
                        this.showToast('Erro ao ler arquivo JSON', 'info');
                    }
                };
                reader.readAsText(file);
            }
        };

        // Initialize
        window.onload = () => {
            app.init();
            app.setupListeners();
            
            // Drag and Drop (Simple Sortable Implementation could go here)
            // For now, using basic array manipulation buttons
        };
    </script>
</body>
</html>
